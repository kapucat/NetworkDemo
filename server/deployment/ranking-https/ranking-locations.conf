# Include inside the existing HTTPS server block.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

location ~ ^/ranking/(health|api/(scores|rankings|best|stats))$ {
    set $ranking_backend ranking-api:8080;
    rewrite ^/ranking/(.*)$ /$1 break;
    proxy_pass http://$ranking_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location /ranking/ { return 404; }
